[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peaxart"
version = "0.1.0.dev0"
description = "Peak extraction in the retention time / m/z domain of GC-TOF-MS data (from alpinac)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE" }
authors = [
  { name = "Lionel Constantin", email = "lionel.constantin@empa.ch" },
  { name = "Myriam Guillevic" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "numba>=0.58",
]

[project.optional-dependencies]
test = ["pytest"]
notebook = ["matplotlib", "jupyter", "nbformat", "nbclient"]

[tool.hatch.build.targets.wheel]
packages = ["src/peaxart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
